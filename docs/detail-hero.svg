<svg width="760" height="400" viewBox="0 0 760 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="400" rx="20" fill="#F5F7FB"/>
  <!-- left: chat mock -->
  <rect x="28" y="42" width="290" height="316" rx="14" fill="#FFFFFF" stroke="#E3E8EF"/>
  <text x="48" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8A93A0">DSH session</text>
  <rect x="48" y="92" width="218" height="52" rx="10" fill="#EEF3FF"/>
  <text x="62" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1F2329">Group the ungrouped sessions</text>
  <text x="62" y="131" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1F2329">by directory, then report back.</text>
  <rect x="82" y="162" width="218" height="72" rx="10" fill="#F6F7F9"/>
