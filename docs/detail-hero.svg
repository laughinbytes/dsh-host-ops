  <rect x="456" y="42" width="276" height="92" rx="14" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="474" y="60" width="30" height="30" rx="8" fill="#7CB7FF"/>
  <text x="518" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1F2329">Workspaces</text>
  <text x="518" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">list · create · rename · reorder · archive</text>
  <rect x="456" y="154" width="276" height="92" rx="14" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="474" y="172" width="30" height="30" rx="8" fill="#45D9E7"/>
  <text x="518" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1F2329">Sessions</text>
  <text x="518" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">send · steer · wait · cursor reads</text>
  <rect x="456" y="266" width="276" height="92" rx="14" fill="#FFFFFF" stroke="#E3E8EF"/>
  <rect x="474" y="284" width="30" height="30" rx="8" fill="#A23AE7"/>
