  <text x="518" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">preview → approve → audit → revert</text>
  <rect x="616" y="278" width="112" height="24" rx="12" fill="#EEF3FF"/>
  <text x="672" y="294" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#145AF3">governed</text>
