  <rect x="48" y="256" width="218" height="42" rx="10" fill="#EEF3FF"/>
  <text x="62" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1F2329">Go to session-xxx and run the tests.</text>
  <rect x="48" y="316" width="172" height="26" rx="13" fill="#145AF3"/>
  <text x="64" y="333" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#FFFFFF">wait for the reply…</text>
  <!-- middle: agent + arrows -->
  <circle cx="392" cy="200" r="34" fill="#145AF3"/>
  <text x="392" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">A</text>
  <text x="392" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280">agent</text>
  <path d="M336 200H354" stroke="#B9C4D2" stroke-width="2" stroke-linecap="round"/>
  <path d="M430 200H448" stroke="#B9C4D2" stroke-width="2" stroke-linecap="round"/>
  <path d="M444 195L452 200L444 205" stroke="#B9C4D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
